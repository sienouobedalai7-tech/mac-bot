name: MAC Bot - Robot de Trading

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

concurrency:
  group: mac-bot-cron
  cancel-in-progress: false

jobs:
  run-robot:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le robot MAC Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_KEY_1: ${{ secrets.TWELVE_DATA_KEY_1 }}
          TWELVE_DATA_KEY_2: ${{ secrets.TWELVE_DATA_KEY_2 }}
          TWELVE_DATA_KEY_3: ${{ secrets.TWELVE_DATA_KEY_3 }}
          TWELVE_DATA_KEY_4: ${{ secrets.TWELVE_DATA_KEY_4 }}
        run: python main.py

      - name: Commit et push de l'état mis à jour
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "MAC Bot"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour état positions [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "Aucun changement d'état à commiter."
          fi
